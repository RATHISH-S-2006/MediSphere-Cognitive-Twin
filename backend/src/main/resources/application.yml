server:
  port: 8080

spring:
  application:
    name: medisphere-backend
  
  mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/medisphere}
  
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: medisphere-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

medisphere:
  fhir:
    base-url: ${FHIR_BASE_URL:http://localhost:8081/fhir}
  ml:
    base-url: ${ML_SERVICE_URL:http://localhost:8001}
    connect-timeout-ms: ${ML_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ML_READ_TIMEOUT_MS:10000}
  wearable-simulator:
    enabled: false
    interval-ms: 5000
    profile: ${MEDISPHERE_WEARABLE_SIMULATOR_PROFILE:NORMAL}
  monitoring:
    rules:
      - alert-type: HEART_RATE_HIGH
        vital-type: HEART_RATE
        severity: HIGH
        operator: GREATER_THAN
        threshold: 120
        enabled: true
      - alert-type: HEART_RATE_LOW
        vital-type: HEART_RATE
        severity: MEDIUM
        operator: LESS_THAN
        threshold: 50
        enabled: true
      - alert-type: SPO2_LOW
        vital-type: SPO2
        severity: CRITICAL
        operator: LESS_THAN
        threshold: 92
        enabled: true
      - alert-type: TEMPERATURE_HIGH
        vital-type: TEMPERATURE
        severity: MEDIUM
        operator: GREATER_THAN
        threshold: 38
        enabled: true
      - alert-type: SYSTOLIC_BP_HIGH
        vital-type: SYSTOLIC_BLOOD_PRESSURE
        severity: HIGH
        operator: GREATER_THAN
        threshold: 140
        enabled: true
      - alert-type: DIASTOLIC_BP_HIGH
        vital-type: DIASTOLIC_BLOOD_PRESSURE
        severity: HIGH
        operator: GREATER_THAN
        threshold: 90
        enabled: true
