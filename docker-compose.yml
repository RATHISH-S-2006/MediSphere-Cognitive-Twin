services:
  mongodb:
    image: mongo:7.0
    container_name: medisphere-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: medisphere
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo "db.runCommand('ping').ok" | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: medisphere-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  hapi-fhir:
    image: hapiproject/hapi:v7.4.0
    container_name: medisphere-fhir
    ports:
      - "8081:8080"
    environment:
      - hapi.fhir.tester.home.name=Local Tester
      - hapi.fhir.tester.home.server_address=http://localhost:8081/fhir
      - spring.datasource.url=jdbc:h2:file:./target/database/h2
    volumes:
      - fhir_data:/database

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medisphere-backend
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/medisphere
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FHIR_BASE_URL=http://hapi-fhir:8080/fhir
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
      hapi-fhir:
        condition: service_started

volumes:
  mongo_data:
  kafka_data:
  fhir_data:
